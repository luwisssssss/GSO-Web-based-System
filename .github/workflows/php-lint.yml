name: PHP lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show PHP version
        run: php --version

      - name: Lint PHP sources
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
